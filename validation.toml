# Validation manifest: the provenance of each test file's vectors.
primitive = "Prime-IR trait surface: prime-field / EC arithmetic over GF(2^255-19) (Curve25519 base field + edwards25519, RFC 8032), and the field Z_q with the ring Z_q[X]/(X^256+1) and its NTT at two lattice moduli — the ML-DSA modulus q = 8380417 with the complete 8-layer transform (FIPS 204 §7.5) and the ML-KEM modulus q = 3329 with the incomplete 7-layer transform (FIPS 203 §4.3)"
reference = "RFC 8032 edwards25519 published constants: base point B, curve parameter d, and the prime subgroup order L = 2^252 + 27742317777372353535851937790883648493. Field law anchored by (p-1)^2 = 1 mod p; group law anchored by [L]B = O and [L+1]B = B. For the ML-DSA instance: FIPS 204 Table 1 (q), §7.5 (zeta = 1753), Algorithm 42 (256^-1 = 8347681), Appendix B (zetas table), and an independent FIPS 204 implementation validated against the NIST ACVP vectors. For the ML-KEM instance: FIPS 203 §4.3 (q = 3329, zeta = 17, 128^-1 = 3303), Algorithms 9-12, and an independent FIPS 203 implementation validated against the NIST ML-KEM-768 KAT vectors."
reference_kind = "rfc-vectors"
test_files = ["tests/kat.rs", "tests/poly_laws_control.rs"]
notes = "kat.rs asserts (i) field identities (a*ONE=a, a*inv(a)=ONE, distributivity, (p-1)^2=1) cross-checked against num-bigint directly; (ii) the Montgomery contract from_mont(to_mont a)=a and mont_mul(to_mont a, to_mont b)=to_mont(a*b); (iii) the EC group law against RFC 8032 published values — [L]B = identity and [L+1]B = B, where L is the published edwards25519 subgroup order and B the published base point. The two lattice instances are also cross-checked against independent FIPS 204 and FIPS 203 implementations; those tests live with the implementations they compare against, each recording its assertions in its own validation manifest. Both instances additionally pass the generic law suite src/poly_laws.rs (transform bijection on an arbitrary element of the NTT form, basemul, ntt_add and ntt_sub as the ring operations transported along the transform, the construction of an element in NTT form entry by entry from NTT_ZERO, the coefficient-wise operations, the ring axioms, and the generic callers, on pseudorandom inputs). poly_laws_control.rs is the control on that suite: four instances each breaking one law (entry-wise basemul, a scalar-dropping poly_smul, an unscaled intt, an ntt_sub that subtracts in the other direction) and the suite rejects all four. The reference instances are the opaque arithmetic leaves; hax extracts only the trait surface."

