# Validation manifest — see scripts/hax-validation/README.md
primitive = "Prime-IR trait surface: prime-field / EC arithmetic over GF(2^255-19) (Curve25519 base field + edwards25519, RFC 8032), and the field Z_q with the ring Z_q[X]/(X^256+1) and its NTT at the ML-DSA modulus q = 8380417 (FIPS 204 §7.5)"
reference = "RFC 8032 edwards25519 published constants: base point B, curve parameter d, and the prime subgroup order L = 2^252 + 27742317777372353535851937790883648493. Field law anchored by (p-1)^2 = 1 mod p; group law anchored by [L]B = O and [L+1]B = B. For the lattice instance: FIPS 204 Table 1 (q), §7.5 (zeta = 1753), Algorithm 42 (256^-1 = 8347681), Appendix B (zetas table), and the specification crate mldsa-hax, which is validated against the NIST ACVP vectors."
reference_kind = "rfc-vectors"
test_files = ["tests/kat.rs", "tests/lattice_kat.rs"]
notes = "kat.rs asserts (i) field identities (a*ONE=a, a*inv(a)=ONE, distributivity, (p-1)^2=1) cross-checked against num-bigint directly; (ii) the Montgomery contract from_mont(to_mont a)=a and mont_mul(to_mont a, to_mont b)=to_mont(a*b); (iii) the EC group law against RFC 8032 published values — [L]B = identity and [L+1]B = B, where L is the published edwards25519 subgroup order and B the published base point. lattice_kat.rs asserts for the mldsa_q instance (iv) the constants against FIPS 204 and the 255 entries of the zetas table of mldsa-hax; (v) the field operations and the Montgomery contract with R = 2^32 against mldsa-hax, including its signed Algorithm 49; (vi) ntt, intt, basemul and the coefficient-form operations against mldsa-hax (Algorithms 41, 42, 44, 45); (vii) the definition of the transform, ntt(w)[i] = w(zeta^(2*BitRev8(i)+1)), by Horner evaluation; (viii) ntt_mul against the schoolbook negacyclic product, and X^255 * X = -1; (ix) the generic callers mlwe_entry_demo and ntt_dot2_demo against the schoolbook product. The reference instances are the opaque arithmetic leaves; hax extracts only the trait surface."

