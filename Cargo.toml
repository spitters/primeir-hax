[package]
name = "primeir-hax"
version = "0.1.0"
edition = "2021"
description = "Prime-IR trait surface at the hax level — nominal Field/ModArith/EcGroup ops that map to the VIR prime-IR dialect (FieldOp/ModArithMont/ECOp); dual-use rustc + hax"
license = "MIT"
readme = "README.md"

[features]
default = ["bigint-instances"]
# The `num-bigint`-backed reference instances (`fp25519`, `fp256`, and the
# `CtField` / `SqrtRatio` impls over them). Without it the crate is the trait
# surface plus the `mldsa_q` instance, is `no_std` and has no dependency, so a
# `no_std` crate can implement the traits.
bigint-instances = ["dep:num-bigint"]
# The fixed-width instance `fp256_mont`: the P-256 base field as four u64
# Montgomery-domain limbs, with no allocation and no dependency, so it is
# available to a `no_std` consumer. Off by default, so `bigint-instances`
# stays the only instance a default build carries. Its differential tests
# compare it against `fp256` and so need `bigint-instances` as well:
# `cargo test --features fixed-width-instances`.
fixed-width-instances = []

[dependencies]
# The reference instance (opaque arithmetic leaf) is realized with num-bigint.
# It is gated out of the hax extraction (`#[cfg(not(hax))]`), so the trait
# surface extracts even though this dependency is not in hax's input subset.
num-bigint = { version = "0.4", optional = true }

# No dev-dependencies: the crate builds and tests on its own.
#
# The `mldsa_q` and `mlkem_q` reference instances are also cross-checked against
# independent FIPS 204 and FIPS 203 implementations. Those tests live with the
# implementations they compare against, since a crate that depends on this one
# cannot be depended on from here.

[lints.rust]
# hax passes `--cfg hax`; keep rustc from warning on the gate.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(hax)'] }
