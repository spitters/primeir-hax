# The name manifest of primeir-hax: the compiler interface.
#
# One entry per trait item a compiler recognises by name: its qualified def
# path (the path hax prints, `primeir_hax::<module>::<Trait>::<item>`), its
# arity (the number of value arguments, `self` included; 0 for a constant)
# and its op key (`<family>.<op>`). The families are those of the op keys of
# the compiler's name table (`field`, `ring`, `tower`, `gf2`, `codec`) and
# `modarith`, `ec`, `ct`, `sqrt` for the families that table does not yet
# carry.
#
# `tests/names_manifest.rs` checks every entry against the trait declaration
# in `src/` (the item exists in that trait, with that arity) and against
# `hax_frontend_export.json` when that file is present:
#
# * an `[[extracted]]` entry must appear as a def path of the export;
# * a `[[pending]]` entry must not: it was added to the source after the
#   export was taken and appears once the crate is re-extracted. After a
#   re-extraction the test fails on each such entry, which then moves to
#   `[[extracted]]`.
#
# Def paths of the current export that are absent from the source (they
# disappear at the next re-extraction):
#   primeir_hax::Field::to_bytes          (replaced by Field::write_bytes)
#   primeir_hax::field_modulus_limbs      (replaced by Field::MODULUS_LE)
#   primeir_hax::field_modulus_p256_limbs (replaced by Field::MODULUS_LE)
#   primeir_hax::fp256_mont::*            (only under `fieldmodel-witness`)
#
# The format is a subset of TOML: `[[extracted]]` or `[[pending]]` opens an
# entry, followed by `path`, `arity` and `key` lines.

